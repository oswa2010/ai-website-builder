<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Comprobantes - RestoPro Pro</title>
  <link rel="stylesheet" href="/src/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    @media print {
      body { background: white !important; }
      .print-shell {
        background: white !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        max-width: 100% !important;
        padding: 24px !important;
      }
    }
  </style>
</head>
<body class="h-full font-sans antialiased text-stone-900" x-data="{ 
    invoices: [],
    searchQuery: '',
    selectedInvoice: null,
    viewModal: false,

    init() {
        const saved = localStorage.getItem('restopro_invoices');
        if (saved) {
            this.invoices = JSON.parse(saved);
        }
    },

    get filteredInvoices() {
        if (!this.searchQuery) return this.invoices;
        return this.invoices.filter(i => 
            i.customer.ruc.includes(this.searchQuery) || 
            i.customer.nombre.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
            (i.table || '').toLowerCase().includes(this.searchQuery.toLowerCase()) ||
            (i.orderNumber || '').toLowerCase().includes(this.searchQuery.toLowerCase())
        );
    },

    exportToExcel() {
        let csvContent = 'data:text/csv;charset=utf-8,';
        csvContent += 'Referencia,Cliente,RUC,Fecha,Total (USD)\n';
        this.filteredInvoices.forEach(inv => {
            csvContent += `${inv.ref},${inv.customer.nombre},${inv.customer.ruc},${inv.date},${inv.total.toFixed(2)}\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', 'reporte_ventas_restopro.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
}">
  
  <div class="flex h-full overflow-hidden no-print">
    <!-- Sidebar -->
    <aside class="hidden lg:flex lg:flex-shrink-0 lg:w-72 lg:flex-col border-r border-stone-200 bg-white">
      <div class="flex flex-col flex-1 pt-8 pb-4 px-6">
        <div class="flex items-center px-2 mb-12">
          <div class="bg-red-600 p-2 rounded-xl text-white font-black shadow-lg">R</div>
          <span class="ml-3 text-xl font-black text-stone-900 tracking-tighter uppercase italic">Resto<span class="text-red-600">Pro</span></span>
        </div>
        <nav class="space-y-1 flex-1">
          <a href="/dashboard.html" class="sidebar-link">Dashboard</a>
          <a href="/reservations.html" class="sidebar-link">Reservas</a>
          <a href="/pos.html" class="sidebar-link">Punto de Venta</a>
          <a href="/billing.html" class="sidebar-link active text-red-600 font-black">Facturación</a>
        </nav>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 bg-stone-50 overflow-hidden">
      <header class="bg-white border-b border-stone-200 px-8 py-6 flex justify-between items-center z-10">
        <div>
            <h1 class="text-2xl font-black uppercase italic tracking-tighter text-stone-900">Historial Financiero</h1>
            <p class="text-[10px] font-bold text-stone-400 uppercase tracking-widest mt-1">Valores en USD (Dólares)</p>
        </div>
        <div class="flex items-center gap-4">
            <button @click="exportToExcel()" class="bg-emerald-600 text-white px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg hover:bg-emerald-700 transition-all flex items-center gap-2">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Exportar Excel
            </button>
            <input type="text" x-model="searchQuery" placeholder="Buscar RUC o Nombre..." class="bg-stone-50 border border-stone-100 rounded-full px-6 py-2.5 text-xs font-bold outline-none focus:border-red-600 transition-all w-64">
        </div>
      </header>

      <main class="flex-1 overflow-y-auto p-8">
        <div class="bg-white rounded-[3rem] shadow-sm border border-stone-200 overflow-hidden">
          <table class="min-w-full divide-y divide-stone-100">
            <thead class="bg-stone-50/50">
              <tr>
                <th class="px-10 py-5 text-left text-[10px] font-black text-stone-400 uppercase tracking-widest">Referencia / RUC</th>
                <th class="px-10 py-5 text-left text-[10px] font-black text-stone-400 uppercase tracking-widest">Cliente</th>
                <th class="px-10 py-5 text-left text-[10px] font-black text-stone-400 uppercase tracking-widest">Mesa / Pedido</th>
                <th class="px-10 py-5 text-left text-[10px] font-black text-stone-400 uppercase tracking-widest">Total USD</th>
                <th class="px-10 py-5 text-right text-[10px] font-black text-stone-400 uppercase tracking-widest">Acción</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-stone-100 bg-white">
              <template x-for="inv in filteredInvoices" :key="inv.id">
                <tr class="hover:bg-stone-50/80 transition group cursor-pointer" @click="selectedInvoice = inv; viewModal = true">
                  <td class="px-10 py-7">
                    <p class="text-xs font-black text-stone-900" x-text="inv.ref"></p>
                    <p class="text-[9px] font-bold text-red-600 uppercase tracking-widest" x-text="inv.customer.ruc"></p>
                  </td>
                  <td class="px-10 py-7">
                    <p class="text-xs font-black text-stone-900 uppercase" x-text="inv.customer.nombre"></p>
                  </td>
                  <td class="px-10 py-7">
                    <p class="text-xs font-black text-stone-900" x-text="inv.table || 'Mesa no registrada'"></p>
                    <p class="text-[9px] font-bold text-red-600 uppercase tracking-widest" x-text="inv.orderNumber || 'Sin pedido'"></p>
                  </td>
                  <td class="px-10 py-7">
                    <p class="text-sm font-black text-stone-900" x-text="`$ ${inv.total.toFixed(2)}`"></p>
                    <p class="text-[9px] font-bold text-stone-400 uppercase tracking-widest" x-text="`IVA 15%: $ ${inv.tax.toFixed(2)}`"></p>
                  </td>
                  <td class="px-10 py-7 text-right">
                    <button class="bg-stone-900 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest">Ver Ticket</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Detalle Factura -->
  <div x-show="viewModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/90 backdrop-blur-md" x-cloak>
    <div class="print-area print-shell bg-white rounded-[3.5rem] w-full max-w-2xl overflow-hidden shadow-2xl p-12">
        <template x-if="selectedInvoice">
            <div>
                <div class="flex justify-between items-start mb-10 text-stone-900">
                    <div>
                        <h2 class="text-3xl font-black uppercase italic tracking-tighter" x-text="selectedInvoice.ref"></h2>
                        <p class="text-[10px] font-bold text-stone-400 uppercase tracking-widest" x-text="selectedInvoice.date"></p>
                    </div>
                    <button @click="viewModal = false" class="no-print bg-stone-100 p-3 rounded-full hover:bg-red-50 hover:text-red-600 transition text-stone-400">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-8 mb-10 bg-stone-50 p-6 rounded-3xl text-stone-900">
                    <div>
                        <p class="text-[9px] font-black uppercase text-stone-400 mb-1">Cliente</p>
                        <p class="text-sm font-black uppercase" x-text="selectedInvoice.customer.nombre"></p>
                        <p class="text-[10px] font-bold text-stone-500" x-text="selectedInvoice.customer.ruc"></p>
                    </div>
                    <div>
                        <p class="text-[9px] font-black uppercase text-stone-400 mb-1">Mesa / Pedido</p>
                        <p class="text-[10px] font-bold" x-text="selectedInvoice.table || 'Mesa no registrada'"></p>
                        <p class="text-[10px] font-bold" x-text="selectedInvoice.orderNumber || 'Sin pedido'"></p>
                    </div>
                </div>

                <div class="space-y-4 mb-10 text-stone-900">
                    <p class="text-[10px] font-black uppercase tracking-widest text-stone-400 border-b pb-2">Artículos Facturados</p>
                    <div class="grid grid-cols-[1.5fr_0.5fr_0.7fr_0.8fr] gap-3 text-[10px] font-black uppercase tracking-widest text-stone-400">
                        <span>Producto</span>
                        <span class="text-center">Cant.</span>
                        <span class="text-right">Precio</span>
                        <span class="text-right">Subtotal</span>
                    </div>
                    <template x-for="item in selectedInvoice.items">
                        <div class="grid grid-cols-[1.5fr_0.5fr_0.7fr_0.8fr] gap-3 border-b border-stone-100 pb-3 text-xs font-bold uppercase">
                            <span x-text="item.name"></span>
                            <span class="text-center" x-text="item.qty"></span>
                            <span class="text-right" x-text="`$ ${item.price.toFixed(2)}`"></span>
                            <span class="text-right" x-text="`$ ${(item.price * item.qty).toFixed(2)}`"></span>
                        </div>
                    </template>
                </div>

                <div class="border-t-2 border-stone-900 pt-6 space-y-2 text-stone-900">
                    <div class="flex justify-between text-xs opacity-50 font-black">
                        <span>SUBTOTAL</span>
                        <span x-text="`$ ${selectedInvoice.subtotal.toFixed(2)}`"></span>
                    </div>
                    <div class="flex justify-between text-xs opacity-50 font-black">
                        <span>IVA (15%)</span>
                        <span x-text="`$ ${selectedInvoice.tax.toFixed(2)}`"></span>
                    </div>
                    <div class="flex justify-between text-3xl font-black uppercase tracking-tighter pt-4 border-t border-stone-100">
                        <span>Total Neto</span>
                        <span x-text="`$ ${selectedInvoice.total.toFixed(2)}`"></span>
                    </div>
                </div>

                <button @click="window.print()" class="no-print w-full mt-10 py-5 bg-stone-950 text-white rounded-[2rem] font-black text-xs uppercase tracking-widest shadow-xl hover:bg-red-600 transition-all">Imprimir Ticket</button>
            </div>
        </template>
    </div>
  </div>

</body>
</html>
