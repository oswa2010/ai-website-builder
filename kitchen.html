<!DOCTYPE html>
<html lang="es" class="h-full bg-stone-950 text-white antialiased scroll-pt-20">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDS PRO - Centro de Producción</title>
  <link rel="stylesheet" href="./src/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .ticket-glow-urgent { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
    .scroll-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="h-full overflow-hidden font-mono" x-data="{ 
  orders: [],
  init() {
    this.refreshOrders();
    window.addEventListener('storage', () =>
 this.refreshOrders());
    setInterval(() => this.refreshOrders(), 1500);
    setInterval(() => this.orders = [...this.orders], 1000);
  },
  refreshOrders() {
    const saved = localStorage.getItem('restopro_kitchen_orders');
    if (saved) {
      let realOrders = JSON.parse(saved);
      this.orders = realOrders.map(o => ({
        ...o,
        items: typeof o.items[0] === 'string' ? o.items.map(text => {
            let parts = text.split('x ');
            return { n: parts[1], q: parseInt(parts[0]), c: 'Terminal POS' };
        }) : o.items
      }));
    } else {
      this.orders = [];
    }
  },
  completeOrder(id) {
    this.orders = this.orders.filter(o => o.id !== id);
    localStorage.setItem('restopro_kitchen_orders', JSON.stringify(this.orders));
  },
  getSummary() {
    let summary = {};
    this.orders.forEach(o => o.items.forEach(i => {
      summary[i.n] = (summary[i.n] || 0) + i.q;
    }));
    return Object.entries(summary);
  },
  getTimeElapsed(start) {
    let diff = Math.floor((Date.now() - start) / 1000);
    let m = Math.floor(diff / 60);
    let s = diff % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }
}">

  <div class="design3-shell fixed left-0 right-0 top-0 z-[60] border-b border-slate-200/70 bg-white/90 px-3 py-2 shadow-sm backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-3">
      <a href="./index.html" class="flex min-w-0 items-center gap-2 text-slate-950">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-rose-600 to-amber-500 text-xs font-black text-white shadow-lg shadow-rose-500/20">D3</span>
        <span class="hidden min-w-0 sm:block">
          <span class="block truncate text-sm font-black uppercase tracking-[0.16em]">Restaurante Connect</span>
          <span class="block text-xs font-semibold text-slate-500">Design 3 UI/UX</span>
        </span>
      </a>
      <nav class="flex items-center gap-1 overflow-x-auto text-xs font-black text-slate-600 sm:text-sm">
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./dashboard.html">Dashboard</a>
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./pos.html">POS</a>
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./kitchen.html">Cocina</a>
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./reservations.html">Reservas</a>
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./inventory.html">Inventario</a>
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./billing.html">Caja</a>
        <a class="rounded-full px-3 py-2 hover:bg-slate-100 hover:text-slate-950" href="./crm.html">CRM</a>
        <a class="rounded-full bg-slate-950 px-3 py-2 text-white hover:bg-slate-800" href="./login.html">Login</a>
      </nav>
    </div>
  </div>


  <div class="flex h-full">
    
    <!-- Sidebar: Resumen de Producción (Carga de Trabajo) -->
    <aside class="w-72 bg-stone-900 border-r border-stone-800 flex flex-col">
      <div class="p-6 bg-stone-800/50">
        <h2 class="text-xs font-black text-stone-500 uppercase tracking-[0.2em] mb-4">Carga de Producción</h2>
        <div class="space-y-3">
          <template x-for="[name, qty] in getSummary()" :key="name">
            <div class="flex justify-between items-center bg-stone-950 p-3 rounded-lg border border-stone-800">
              <span class="text-sm font-bold text-stone-300" x-text="name"></span>
              <span class="bg-red-600 text-white px-2 py-0.5 rounded-md font-black text-lg" x-text="qty"></span>
            </div>
          </template>
        </div>
      </div>
      <div class="mt-auto p-6 border-t border-stone-800">
        <div class="flex items-center gap-3 mb-4">
          <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-[10px] font-bold text-stone-400 uppercase tracking-widest">Servidor Activo</span>
        </div>
        <button @click="const nextOrders = [{ id: Date.now(), table: 'M-08', type: 'Demo', items: [{n:'Risotto Setas', q:1, c:'Caliente'}], start: Date.now(), status: 'new' }, ...orders]; orders = nextOrders; localStorage.setItem('restopro_kitchen_orders', JSON.stringify(nextOrders));" 
                class="w-full py-3 bg-red-600/10 border border-red-600/50 text-red-500 rounded-xl text-[10px] font-black uppercase hover:bg-red-600 hover:text-white transition group">
          Simular Pedido
        </button>
      </div>
    </aside>

    <!-- Área Principal de Tickets -->
    <main class="flex-1 flex flex-col min-w-0">
      
      <!-- Header KDS Pro -->
      <header class="h-20 bg-stone-900 border-b border-stone-800 px-8 flex justify-between items-center">
        <div class="flex items-center gap-6">
          <h1 class="text-2xl font-black italic tracking-tighter">KDS<span class="text-red-600">PRO</span></h1>
          <div class="flex gap-4">
            <button class="px-4 py-2 bg-stone-800 rounded-lg text-[10px] font-black uppercase border-b-2 border-red-600">Todos</button>
            <button class="px-4 py-2 bg-stone-950 rounded-lg text-[10px] font-black uppercase text-stone-500">Caliente</button>
            <button class="px-4 py-2 bg-stone-950 rounded-lg text-[10px] font-black uppercase text-stone-500">Frío</button>
          </div>
        </div>
        <div class="flex gap-8">
          <button @click="refreshOrders()" class="px-4 py-2 bg-stone-800 rounded-lg text-[10px] font-black uppercase text-stone-300 hover:bg-stone-700 transition">Refrescar</button>
          <div class="text-right">
            <p class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Tickets Activos</p>
            <p class="text-2xl font-black text-white" x-text="orders.length"></p>
          </div>
          <div class="text-right">
            <p class="text-[10px] font-bold text-stone-500 uppercase tracking-widest">Tiempo Objetivo</p>
            <p class="text-2xl font-black text-emerald-500">15:00</p>
          </div>
        </div>
      </header>

      <!-- Tickets Grid -->
      <div class="flex-1 overflow-x-auto p-8 flex gap-8 items-start scroll-hide">
        
        <template x-for="order in orders" :key="order.id">
          <div :class="{'ticket-glow-urgent ring-2 ring-red-600': (Date.now() - order.start) > 600000}" 
               class="flex-shrink-0 w-96 bg-stone-900 rounded-[2rem] border border-stone-800 flex flex-col max-h-full shadow-2xl transition-all duration-500">
            
            <!-- Ticket Header -->
            <div class="p-6 pb-2 flex justify-between items-start">
              <div>
                <h3 class="text-3xl font-black tracking-tighter" x-text="order.table"></h3>
                <p class="text-[10px] font-bold text-stone-500 uppercase tracking-widest" x-text="order.orderNumber ? `Pedido ${order.orderNumber}` : `Ticket #${order.id}`"></p>
                <p class="mt-1 text-xs font-bold text-stone-300" x-show="order.customer" x-text="order.customer"></p>
              </div>
              <div :class="(Date.now() - order.start) > 600000 ? 'bg-red-600' : 'bg-stone-800'" 
                   class="px-4 py-2 rounded-xl">
                <p class="text-xl font-black tabular-nums" x-text="getTimeElapsed(order.start)"></p>
              </div>
            </div>

            <!-- Ticket Items -->
            <div class="flex-1 px-6 py-4 overflow-y-auto">
              <div class="space-y-1">
                <template x-for="item in order.items">
                  <div class="flex items-center gap-4 p-3 hover:bg-stone-800/50 rounded-xl transition group cursor-pointer border-b border-stone-800/50">
                    <span class="text-2xl font-black text-red-600 w-8" x-text="item.q"></span>
                    <div class="flex-1">
                      <p class="text-lg font-bold text-stone-100 uppercase tracking-tight" x-text="item.n"></p>
                      <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-stone-800 text-stone-400" x-text="item.c"></span>
                    </div>
                    <div class="h-6 w-6 rounded-full border-2 border-stone-700 group-hover:border-emerald-500 flex items-center justify-center">
                        <div class="h-3 w-3 rounded-full bg-emerald-500 opacity-0 group-hover:opacity-100 transition"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Ticket Footer -->
            <div class="p-6 bg-stone-900/50 rounded-b-[2rem] flex gap-3">
              <button class="flex-1 py-4 bg-stone-800 hover:bg-stone-700 rounded-2xl text-xs font-black uppercase transition tracking-widest">Marchar</button>
              <button @click="completeOrder(order.id)" 
                      class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-500 rounded-2xl text-xs font-black uppercase transition tracking-widest shadow-lg shadow-emerald-900/20">Listo</button>
            </div>
          </div>
        </template>

      </div>
    </main>
  </div>

  <!-- Notificación de Alerta Sonora (Visual) -->
  <div x-show="orders.some(o => (Date.now() - o.start) > 600000)" 
       x-cloak
       class="fixed top-24 left-1/2 -translate-x-1/2 bg-red-600 text-white px-8 py-4 rounded-full shadow-2xl flex items-center gap-6 border-4 border-white animate-pulse z-50">
    <span class="text-2xl font-black">¡ATENCIÓN CHEF!</span>
    <span class="text-sm font-bold uppercase">Hay mesas fuera de tiempo</span>
  </div>

</body>
</html>
