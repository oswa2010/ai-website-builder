<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - RestoPro Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full antialiased"
      style="background-color:#0a0a14;color:#F0F0FF;font-family:'Inter',system-ui,sans-serif;"
      x-data="{
        user: null,
        myOrders: [],
        init() {
            const current = localStorage.getItem('restopro_current_user');
            if (!current) {
                window.location.href = '/login.html';
                return;
            }
            this.user = JSON.parse(current);

            // Buscar mis facturas por Cédula/RUC
            const allInvoices = JSON.parse(localStorage.getItem('restopro_invoices') || '[]');
            this.myOrders = allInvoices.filter(i => i.customer.ruc === this.user.cedula);
        },
        logout() {
            localStorage.removeItem('restopro_current_user');
            window.location.href = '/index.html';
        }
      }">

  <!-- Background radial glows -->
  <div style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;">
    <div style="position:absolute;top:-15%;right:-10%;width:700px;height:700px;background:radial-gradient(circle,rgba(124,58,237,0.11) 0%,transparent 65%);border-radius:50%;"></div>
    <div style="position:absolute;bottom:-20%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(79,70,229,0.08) 0%,transparent 65%);border-radius:50%;"></div>
  </div>

  <!-- Header -->
  <header style="background:rgba(10,10,20,0.90);border-bottom:1px solid rgba(139,92,246,0.16);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;">
    <div class="container mx-auto flex justify-between items-center px-6 py-4">
      <a href="/index.html" class="flex items-center gap-3 no-underline">
        <div style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:0.75rem;background:linear-gradient(135deg,#7C3AED,#4F46E5);box-shadow:0 4px 16px rgba(124,58,237,0.4);">
          <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
          </svg>
        </div>
        <span class="text-xl font-black tracking-tighter uppercase italic" style="color:#F0F0FF;">
          Resto<span style="color:#A78BFA;">Pro</span>
        </span>
      </a>
      <button @click="logout()"
              class="text-[10px] font-black uppercase tracking-widest transition"
              style="color:#4A4A68;"
              onmouseover="this.style.color='#A78BFA'" onmouseout="this.style.color='#4A4A68'">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="py-16 px-6 sm:px-8" style="position:relative;z-index:1;">
    <div class="container mx-auto max-w-5xl">

      <!-- Profile header -->
      <div class="flex flex-col md:flex-row justify-between items-end mb-14 gap-8">
        <div>
          <span class="section-label mb-4 block">Área de Miembro</span>
          <h1 class="text-5xl font-black tracking-tighter uppercase italic" style="color:#F0F0FF;"
              x-text="`Hola, ${user?.nombre}`"></h1>
          <p class="mt-2 font-medium" style="color:#8B8BA8;"
             x-text="`Cédula: ${user?.cedula} • ${user?.email}`"></p>
        </div>
        <a href="/index.html#menu" class="btn btn-primary btn-lg">Hacer Nuevo Pedido</a>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

        <!-- Left column: Stats -->
        <div class="lg:col-span-1 space-y-6">

          <!-- Puntos card -->
          <div style="background:#12102a;border:1px solid rgba(139,92,246,0.14);border-radius:1.75rem;padding:2rem;">
            <h3 class="text-[10px] font-black uppercase tracking-widest mb-5" style="color:#4A4A68;">Puntos RestoPro</h3>
            <div class="flex items-center gap-4">
              <div style="width:48px;height:48px;background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;">
                <span style="color:#A78BFA;font-size:1.25rem;font-weight:900;">★</span>
              </div>
              <div>
                <p class="text-3xl font-black" style="color:#F0F0FF;" x-text="myOrders.length * 10"></p>
                <p class="text-[9px] font-bold uppercase tracking-widest mt-0.5" style="color:#4A4A68;">Puntos acumulados</p>
              </div>
            </div>
          </div>

          <!-- Total gastado card -->
          <div style="background:linear-gradient(135deg,rgba(124,58,237,0.15) 0%,rgba(79,70,229,0.10) 100%);border:1px solid rgba(139,92,246,0.25);border-radius:1.75rem;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.35);">
            <h3 class="text-[10px] font-black uppercase tracking-widest mb-3" style="color:#8B8BA8;">Total Gastado</h3>
            <p class="text-4xl font-black tracking-tighter" style="color:#F0F0FF;"
               x-text="`$ ${myOrders.reduce((sum, o) => sum + o.total, 0).toFixed(2)}`"></p>
            <p class="text-[9px] font-bold uppercase tracking-widest mt-4" style="color:#4A4A68;">Inversión en experiencias</p>
          </div>

          <!-- Quick nav -->
          <div style="background:#12102a;border:1px solid rgba(139,92,246,0.14);border-radius:1.75rem;padding:1.5rem;">
            <h3 class="text-[10px] font-black uppercase tracking-widest mb-4" style="color:#4A4A68;">Acceso rápido</h3>
            <nav class="space-y-1">
              <a href="/carta-cliente.html" class="sidebar-link">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                Carta del cliente
              </a>
              <a href="/index.html" class="sidebar-link">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Inicio
              </a>
              <a href="/dashboard.html" class="sidebar-link">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                Dashboard
              </a>
            </nav>
          </div>

        </div>

        <!-- Right column: Order history -->
        <div class="lg:col-span-2">
          <h3 class="text-sm font-black uppercase tracking-widest mb-8 italic" style="color:#F0F0FF;">Mis Pedidos Recientes</h3>

          <div class="space-y-4">
            <template x-for="order in myOrders" :key="order.ref">
              <div style="background:#12102a;border:1px solid rgba(139,92,246,0.14);border-radius:1.75rem;padding:2rem;transition:all 0.25s ease;"
                   class="group"
                   onmouseover="this.style.borderColor='rgba(139,92,246,0.30)';this.style.boxShadow='0 16px 48px rgba(0,0,0,0.4)';"
                   onmouseout="this.style.borderColor='rgba(139,92,246,0.14)';this.style.boxShadow='none';">
                <div class="flex justify-between items-start mb-4">
                  <div>
                    <p class="text-[10px] font-black uppercase tracking-widest" style="color:#7C3AED;" x-text="order.ref"></p>
                    <p class="text-xs font-bold mt-1" style="color:#8B8BA8;" x-text="order.date"></p>
                  </div>
                  <span class="text-xl font-black" style="color:#F0F0FF;" x-text="`$ ${order.total.toFixed(2)}`"></span>
                </div>
                <div class="flex gap-2 flex-wrap">
                  <template x-for="item in order.items">
                    <span class="badge badge-neutral" x-text="`${item.qty}x ${item.name}`"></span>
                  </template>
                </div>
                <button class="mt-5 text-[9px] font-black uppercase tracking-widest transition"
                        style="color:#4A4A68;"
                        onmouseover="this.style.color='#A78BFA'" onmouseout="this.style.color='#4A4A68'">
                  Descargar Factura PDF
                </button>
              </div>
            </template>

            <!-- Empty state -->
            <div x-show="myOrders.length === 0"
                 class="py-20 text-center rounded-[2rem]"
                 style="border:2px dashed rgba(139,92,246,0.16);">
              <div style="width:56px;height:56px;background:rgba(124,58,237,0.10);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:#4A4A68;">
                  <path stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
              </div>
              <p class="font-black uppercase text-xs tracking-widest" style="color:#4A4A68;">Aún no has realizado pedidos</p>
              <a href="/carta-cliente.html" class="btn btn-primary btn-sm mt-6 inline-flex">
                Ver carta del cliente
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
